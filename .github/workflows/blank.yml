name: Build TableMate Windows v90 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Rebuild TableMate repo from source chunks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = "$env:GITHUB_WORKSPACE\source"
          $zipPath = "$env:GITHUB_WORKSPACE\tablemate-source.zip"
          $extractDir = "$env:GITHUB_WORKSPACE\tablemate-extracted"

          function Clean-B64([string]$text) {
            $clean = $text -replace '[^A-Za-z0-9+/=]', ''
            return $clean
          }

          function Pad-B64([string]$text) {
            while (($text.Length % 4) -ne 0) { $text += "=" }
            return $text
          }

          function Test-Zip([string]$path) {
            try {
              if (-not (Test-Path $path)) { return $false }
              if ((Get-Item $path).Length -lt 100) { return $false }
              $testDir = "$env:GITHUB_WORKSPACE\zip-test"
              if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $testDir | Out-Null
              Expand-Archive -Path $path -DestinationPath $testDir -Force
              return $true
            }
            catch {
              Write-Host "ZIP test failed: $($_.Exception.Message)"
              return $false
            }
          }

          if (Test-Path $sourceDir) {
            $parts = Get-ChildItem -Path $sourceDir -Filter "part-*.b64" | Sort-Object Name
          } else {
            $parts = @()
          }

          if ($parts.Count -gt 0) {
            Write-Host "Found $($parts.Count) source chunk(s)."

            $rebuilt = $false

            # Method 1: chunks are pieces of one base64 string
            try {
              Write-Host "Trying rebuild method 1: joined base64 string..."
              $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
              $joined = Clean-B64 $joined

              # remove padding that appears before the final end, then pad once at the end
              $joinedNoPad = $joined -replace '=', ''
              $joinedNoPad = Pad-B64 $joinedNoPad

              [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($joinedNoPad))

              if (Test-Zip $zipPath) {
                Write-Host "Method 1 worked."
                $rebuilt = $true
              }
            }
            catch {
              Write-Host "Method 1 failed: $($_.Exception.Message)"
            }

            # Method 2: each part is its own base64-encoded byte block
            if (-not $rebuilt) {
              try {
                Write-Host "Trying rebuild method 2: decode each chunk and append bytes..."
                if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

                foreach ($part in $parts) {
                  Write-Host "Decoding $($part.Name)..."
                  $txt = Get-Content $part.FullName -Raw
                  $txt = Clean-B64 $txt
                  $txt = Pad-B64 $txt
                  $bytes = [Convert]::FromBase64String($txt)
                  [IO.File]::Open($zipPath, [IO.FileMode]::Append).Close()
                  $stream = [IO.File]::Open($zipPath, [IO.FileMode]::Append)
                  $stream.Write($bytes, 0, $bytes.Length)
                  $stream.Close()
                }

                if (Test-Zip $zipPath) {
                  Write-Host "Method 2 worked."
                  $rebuilt = $true
                }
              }
              catch {
                Write-Host "Method 2 failed: $($_.Exception.Message)"
              }
            }

            if (-not $rebuilt) {
              throw "Could not rebuild a valid ZIP from source/part-*.b64. The source chunk files are damaged or incomplete."
            }

            if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

            $package = Get-ChildItem -Path $extractDir -Filter package.json -Recurse |
              Where-Object { $_.FullName -notmatch "\\node_modules\\" } |
              Sort-Object FullName |
              Select-Object -First 1

            if (-not $package) {
              throw "No package.json found after extracting the TableMate source ZIP."
            }

            $appDir = Split-Path $package.FullName -Parent
            echo "APP_DIR=$appDir" >> $env:GITHUB_ENV
            Write-Host "Using extracted app folder: $appDir"
          }
          elseif (Test-Path "$env:GITHUB_WORKSPACE\package.json") {
            echo "APP_DIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
            Write-Host "Using root app folder."
          }
          else {
            $package = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter package.json -Recurse |
              Where-Object { $_.FullName -notmatch "\\node_modules\\" } |
              Sort-Object FullName |
              Select-Object -First 1

            if (-not $package) {
              throw "No package.json found. Upload the full TableMate repo contents or source chunks."
            }

            $appDir = Split-Path $package.FullName -Parent
            echo "APP_DIR=$appDir" >> $env:GITHUB_ENV
            Write-Host "Using discovered app folder: $appDir"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          cd "$env:APP_DIR"
          npm install

      - name: Build Windows app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd "$env:APP_DIR"
          npm run dist -- --publish never

      - name: Show release files
        shell: pwsh
        run: |
          Write-Host "Release/dist files:"
          Get-ChildItem -Path "$env:APP_DIR" -Recurse -Include *.exe,*.blockmap,*.yml |
            Where-Object { $_.FullName -match "\\(release|dist)\\" } |
            Select-Object FullName, Length

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifact-output"

          Get-ChildItem -Path "$env:APP_DIR" -Recurse -Include *.exe,*.blockmap,*.yml |
            Where-Object { $_.FullName -match "\\(release|dist)\\" } |
            Copy-Item -Destination "$env:GITHUB_WORKSPACE\artifact-output" -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE\artifact-output"

      - name: Upload final release files
        uses: actions/upload-artifact@v4
        with:
          name: TableMate_Windows_v90_Backup_Button_Fixed_Release
          path: artifact-output/**
          if-no-files-found: error
