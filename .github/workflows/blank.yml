name: Build TableMate Windows v90 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Rebuild TableMate repo from source chunks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sourceDir = "$env:GITHUB_WORKSPACE\source"
          $zipPath = "$env:GITHUB_WORKSPACE\tablemate-source.zip"
          $extractDir = "$env:GITHUB_WORKSPACE\tablemate-extracted"

          if (Test-Path $sourceDir) {
            $parts = Get-ChildItem -Path $sourceDir -Filter "part-*.b64" | Sort-Object Name
          }
          else {
            $parts = @()
          }

          if ($parts.Count -gt 0) {
            Write-Host "Found $($parts.Count) base64 source chunk(s). Rebuilding ZIP by decoding each chunk separately..."

            if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
            $stream = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write)

            try {
              foreach ($part in $parts) {
                Write-Host "Decoding $($part.Name)..."
                $b64 = Get-Content $part.FullName -Raw
                $b64 = $b64 -replace '[^A-Za-z0-9+/=]', ''

                while (($b64.Length % 4) -ne 0) {
                  $b64 += "="
                }

                $bytes = [Convert]::FromBase64String($b64)
                $stream.Write($bytes, 0, $bytes.Length)
              }
            }
            finally {
              $stream.Close()
            }

            Write-Host "ZIP rebuilt at: $zipPath"
            Get-Item $zipPath | Select-Object FullName, Length

            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

            $package = Get-ChildItem -Path $extractDir -Filter package.json -Recurse |
              Where-Object { $_.FullName -notmatch "\\node_modules\\" } |
              Sort-Object FullName |
              Select-Object -First 1

            if (-not $package) {
              throw "No package.json found after extracting the TableMate source ZIP."
            }

            $appDir = Split-Path $package.FullName -Parent
            echo "APP_DIR=$appDir" >> $env:GITHUB_ENV
            Write-Host "Using extracted app folder: $appDir"
          }
          elseif (Test-Path "$env:GITHUB_WORKSPACE\package.json") {
            echo "APP_DIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
            Write-Host "Using root app folder."
          }
          else {
            $package = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter package.json -Recurse |
              Where-Object { $_.FullName -notmatch "\\node_modules\\" } |
              Sort-Object FullName |
              Select-Object -First 1

            if (-not $package) {
              throw "No package.json found. Upload the full TableMate repo contents or keep source/part-*.b64."
            }

            $appDir = Split-Path $package.FullName -Parent
            echo "APP_DIR=$appDir" >> $env:GITHUB_ENV
            Write-Host "Using discovered app folder: $appDir"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          cd "$env:APP_DIR"
          npm install

      - name: Build Windows app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd "$env:APP_DIR"
          npm run dist -- --publish never

      - name: Show release files
        shell: pwsh
        run: |
          Write-Host "Release/dist files:"
          Get-ChildItem -Path "$env:APP_DIR" -Recurse -Include *.exe,*.blockmap,*.yml |
            Where-Object { $_.FullName -match "\\(release|dist)\\" } |
            Select-Object FullName, Length

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifact-output"

          Get-ChildItem -Path "$env:APP_DIR" -Recurse -Include *.exe,*.blockmap,*.yml |
            Where-Object { $_.FullName -match "\\(release|dist)\\" } |
            Copy-Item -Destination "$env:GITHUB_WORKSPACE\artifact-output" -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE\artifact-output"

      - name: Upload final release files
        uses: actions/upload-artifact@v4
        with:
          name: TableMate_Windows_v90_Backup_Button_Fixed_Release
          path: artifact-output/**
          if-no-files-found: error
