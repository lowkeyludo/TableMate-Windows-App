name: Build TableMate Windows v90 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare TableMate app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $rootPackage = "$env:GITHUB_WORKSPACE\package.json"
          $rootIndex = "$env:GITHUB_WORKSPACE\app\index.html"
          $sourceDir = "$env:GITHUB_WORKSPACE\source"
          $zipPath = "$env:GITHUB_WORKSPACE\tablemate-source.zip"
          $extractDir = "$env:GITHUB_WORKSPACE\tablemate-extracted"

          if ((Test-Path $rootPackage) -and (Test-Path $rootIndex)) {
            echo "APP_DIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
            Write-Host "Using root app folder."
            exit 0
          }

          if (-not (Test-Path $sourceDir)) {
            throw "No app/index.html found and no source folder found. Upload the full repo contents or keep source/part-*.b64."
          }

          Write-Host "Root app is incomplete. Rebuilding from source/part-*.b64..."

          $rebuildScript = @'
          const fs = require("fs");
          const path = require("path");
          const zlib = require("zlib");

          const workspace = process.env.GITHUB_WORKSPACE;
          const sourceDir = path.join(workspace, "source");
          const zipPath = path.join(workspace, "tablemate-source.zip");
          const parts = fs.readdirSync(sourceDir)
            .filter(name => /^part-.*\.b64$/i.test(name))
            .sort();

          if (!parts.length) throw new Error("No source/part-*.b64 files found.");
          console.log("Chunk count:", parts.length);

          function clean(txt) {
            return String(txt || "").replace(/[^A-Za-z0-9+/=]/g, "");
          }
          function pad(txt) {
            while (txt.length % 4 !== 0) txt += "=";
            return txt;
          }
          function looksLikeZip(buf) {
            return buf && buf.length > 4 && buf[0] === 0x50 && buf[1] === 0x4b;
          }

          let zip = null;

          // Method 1: all files are pieces of one base64 string.
          try {
            let joined = parts.map(name => fs.readFileSync(path.join(sourceDir, name), "utf8")).join("");
            joined = clean(joined).replace(/=/g, "");
            const buf = Buffer.from(pad(joined), "base64");
            console.log("Method 1 byte length:", buf.length);
            if (looksLikeZip(buf)) zip = buf;
          } catch (err) {
            console.log("Method 1 failed:", err.message);
          }

          // Method 2: each file is a separately encoded byte chunk.
          if (!zip) {
            try {
              const buffers = [];
              for (const name of parts) {
                let txt = clean(fs.readFileSync(path.join(sourceDir, name), "utf8"));
                const buf = Buffer.from(pad(txt), "base64");
                console.log(name, "decoded bytes:", buf.length);
                buffers.push(buf);
              }
              const joined = Buffer.concat(buffers);
              console.log("Method 2 byte length:", joined.length);
              if (looksLikeZip(joined)) zip = joined;
            } catch (err) {
              console.log("Method 2 failed:", err.message);
            }
          }

          if (!zip) throw new Error("Could not rebuild a valid ZIP. The source chunks are damaged or were uploaded incorrectly.");
          fs.writeFileSync(zipPath, zip);
          console.log("ZIP rebuilt:", zipPath, "bytes:", zip.length);
          '@

          Set-Content -Path "$env:GITHUB_WORKSPACE\rebuild-source.js" -Value $rebuildScript -Encoding UTF8
          node "$env:GITHUB_WORKSPACE\rebuild-source.js"

          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $package = Get-ChildItem -Path $extractDir -Filter package.json -Recurse |
            Where-Object { $_.FullName -notmatch "\\node_modules\\" } |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $package) {
            throw "No package.json found after extracting TableMate source ZIP."
          }

          $appDir = Split-Path $package.FullName -Parent
          echo "APP_DIR=$appDir" >> $env:GITHUB_ENV
          Write-Host "Using extracted app folder: $appDir"

      - name: Install dependencies
        shell: pwsh
        run: |
          cd "$env:APP_DIR"
          npm install

      - name: Build Windows app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd "$env:APP_DIR"
          npm run dist -- --publish never

      - name: Show release files
        shell: pwsh
        run: |
          Write-Host "Release/dist files:"
          Get-ChildItem -Path "$env:APP_DIR" -Recurse -Include *.exe,*.blockmap,*.yml |
            Where-Object { $_.FullName -match "\\(release|dist)\\" } |
            Select-Object FullName, Length

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifact-output"

          Get-ChildItem -Path "$env:APP_DIR" -Recurse -Include *.exe,*.blockmap,*.yml |
            Where-Object { $_.FullName -match "\\(release|dist)\\" } |
            Copy-Item -Destination "$env:GITHUB_WORKSPACE\artifact-output" -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE\artifact-output"

      - name: Upload final release files
        uses: actions/upload-artifact@v4
        with:
          name: TableMate_Windows_v90_Backup_Button_Fixed_Release
          path: artifact-output/**
          if-no-files-found: error
